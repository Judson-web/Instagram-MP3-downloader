services:
  - type: web
    name: instagram-mp3-downloader
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: YT_DLP_PATH
        value: yt-dlp