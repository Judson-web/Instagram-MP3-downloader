  <text x="102" y="171" fill="#c95036" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">INSTAGRAM REEL TO MP3</text>
  <text x="70" y="277" fill="#20231f" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="700" letter-spacing="-2">Keep the sound.</text>
  <text x="70" y="355" fill="#c95036" font-family="Arial,Helvetica,sans-serif" font-size="65" font-weight="700" letter-spacing="-2">Lose the scroll.</text>
  <text x="75" y="421" fill="#666960" font-family="Arial,Helvetica,sans-serif" font-size="22">Turn a public Reel into MP3 audio.</text>
  <text x="75" y="455" fill="#666960" font-family="Arial,Helvetica,sans-serif" font-size="22">No account required.</text>
