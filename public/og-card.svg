  <rect x="70" y="62" width="48" height="48" rx="14" fill="#20231f"/>
  <path d="M79 87h6l5-12 7 23 6-19 4 9h4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
